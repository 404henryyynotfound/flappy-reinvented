<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flappy Bird Reinvented | By Henry Green</title>
  
  <!-- Pixel Retro Font from Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Press Start 2P', monospace;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    /* Fullscreen overlays */
    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: #222034;
      transition: transform 0.6s ease-in-out;
    }

    /* Slide off screen animation */
    .screen.slide-out {
      transform: translateY(-100%);
    }

    .hidden {
      display: none !important;
    }

    /* Loading Spinner */
    .spinner {
      width: 40px;
      height: 40px;
      border: 6px solid #f8f8f8;
      border-top-color: #ff0044;
      animation: spin 0.8s steps(8) infinite;
      margin-bottom: 25px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Retro Title & Credits */
    h1 {
      font-size: 1.8rem;
      line-height: 1.4;
      color: #f77622;
      text-shadow: 3px 3px #d95763;
      margin-bottom: 12px;
      padding: 0 20px;
    }

    .author {
      font-size: 0.7rem;
      color: #639bff;
      margin-bottom: 35px;
    }

    /* Retro Menu Buttons */
    .menu-buttons {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 280px;
    }

    button {
      padding: 14px 10px;
      font-size: 0.8rem;
      font-weight: bold;
      border: 4px solid #ffffff;
      border-radius: 0px;
      cursor: pointer;
      background-color: #38b764;
      color: #ffffff;
      box-shadow: 4px 4px #181425;
      image-rendering: pixelated;
    }

    button:hover {
      background-color: #41af6e;
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px #181425;
    }

    button.secondary {
      background-color: #29adff;
    }

    button.secondary:hover {
      background-color: #3cb3ff;
    }

    /* Game Canvas Background */
    #game-screen {
      background: #5973e8; /* Retro sky blue */
    }

    canvas {
      border: 4px solid #ffffff;
      background-color: #3b5dc9;
      box-shadow: 6px 6px #181425;
    }

    /* Score Display Box */
    #score-display {
      font-size: 0.9rem;
      margin-bottom: 12px;
      color: #ffcd75;
      text-shadow: 2px 2px #181425;
    }

    /* Retro Modal Popups */
    .modal {
      position: absolute;
      background: #222034;
      border: 4px solid #ffffff;
      padding: 25px;
      width: 320px;
      text-align: center;
      box-shadow: 8px 8px #181425;
    }

    .modal h2 {
      font-size: 1rem;
      margin-bottom: 20px;
      color: #ffcd75;
    }

    .modal input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 2px solid #ffffff;
      background: #181425;
      color: white;
      font-size: 0.7rem;
    }
  </style>
</head>
<body>

  <!-- 8-Bit Retro Music Audio (Loops automatically) -->
  <audio id="retro-music" loop>
    <source src="https://actions.google.com/sounds/v1/ambiences/arcade_room.ogg" type="audio/ogg">
  </audio>

  <!-- 1. LOADING SCREEN -->
  <div id="loading-screen" class="screen">
    <div class="spinner"></div>
    <h2>LOADING...</h2>
  </div>

  <!-- 2. MAIN MENU SCREEN -->
  <div id="menu-screen" class="screen hidden">
    <h1>FLAPPY BIRD REINVENTED</h1>
    <p class="author">BY HENRY GREEN</p>

    <div class="menu-buttons">
      <button id="play-btn">PLAY GAME</button>
      <button id="upgrades-btn" class="secondary">UPGRADES</button>
      <button id="leaderboard-btn" class="secondary">SCORES</button>
      <button id="account-btn" class="secondary">LOGIN</button>
    </div>
  </div>

  <!-- 3. GAME SCREEN -->
  <div id="game-screen" class="screen hidden">
    <div id="score-display">SCORE: 0</div>
    <canvas id="gameCanvas" width="384" height="512"></canvas>
    <button id="back-to-menu-btn" class="secondary" style="margin-top: 15px; width: 200px;">MENU</button>
  </div>

  <!-- 4. ACCOUNT MODAL -->
  <div id="account-modal" class="modal hidden">
    <h2>PLAYER LOGIN</h2>
    <input type="email" id="email-input" placeholder="EMAIL" />
    <input type="password" id="password-input" placeholder="PASS" />
    <div style="display: flex; gap: 10px; margin-top: 10px;">
      <button id="login-submit-btn" style="flex: 1;">LOGIN</button>
      <button id="signup-submit-btn" class="secondary" style="flex: 1;">JOIN</button>
    </div>
    <button class="secondary close-modal-btn" style="width: 100%; margin-top: 15px;">CLOSE</button>
  </div>

  <!-- 5. LEADERBOARD MODAL -->
  <div id="leaderboard-modal" class="modal hidden">
    <h2>TOP PLAYERS</h2>
    <ol id="leaderboard-list" style="text-align: left; margin: 15px 0 20px 20px; font-size: 0.6rem; line-height: 2;">
      <li>HENRY GREEN — 100</li>
      <li>PLAYER TWO — 75</li>
      <li>GUEST — 40</li>
    </ol>
    <button class="secondary close-modal-btn" style="width: 100%;">CLOSE</button>
  </div>

  <script>
    const loadingScreen = document.getElementById('loading-screen');
    const menuScreen = document.getElementById('menu-screen');
    const gameScreen = document.getElementById('game-screen');
    const accountModal = document.getElementById('account-modal');
    const leaderboardModal = document.getElementById('leaderboard-modal');
    const bgMusic = document.getElementById('retro-music');

    // Simulate loading, start music on first click/interaction
    window.addEventListener('load', () => {
      setTimeout(() => {
        loadingScreen.classList.add('hidden');
        menuScreen.classList.remove('hidden');
      }, 2000);
    });

    // Play retro music on user interaction (browsers block autoplay without a click)
    document.addEventListener('click', () => {
      if (bgMusic.paused) {
        bgMusic.volume = 0.3;
        bgMusic.play().catch(() => {});
      }
    }, { once: true });

    // Play Button - Cleanly swipes menu up off the screen
    document.getElementById('play-btn').addEventListener('click', () => {
      gameScreen.classList.remove('hidden');
      menuScreen.classList.add('slide-out');
      
      setTimeout(() => {
        menuScreen.classList.add('hidden');
        menuScreen.classList.remove('slide-out');
      }, 600);
    });

    // Back to Menu Button
    document.getElementById('back-to-menu-btn').addEventListener('click', () => {
      gameScreen.classList.add('hidden');
      menuScreen.classList.remove('hidden');
    });

    document.getElementById('account-btn').addEventListener('click', () => {
      accountModal.classList.remove('hidden');
    });

    document.getElementById('leaderboard-btn').addEventListener('click', () => {
      leaderboardModal.classList.remove('hidden');
    });

    document.querySelectorAll('.close-modal-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        accountModal.classList.add('hidden');
        leaderboardModal.classList.add('hidden');
      });
    });
  </script>
</body>
</html>
