<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flappy Bird Reinvented | By Henry Green</title>
  
  <!-- Favicon with a little bird -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🐦</text></svg>">

  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Press Start 2P', monospace;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: #222034;
      transition: transform 0.6s ease-in-out;
    }

    .screen.slide-out {
      transform: translateY(-100%);
    }

    .hidden {
      display: none !important;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 6px solid #f8f8f8;
      border-top-color: #ff0044;
      animation: spin 0.8s steps(8) infinite;
      margin-bottom: 25px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    h1 {
      font-size: 1.8rem;
      line-height: 1.4;
      color: #f77622;
      text-shadow: 3px 3px #d95763;
      margin-bottom: 12px;
      padding: 0 20px;
    }

    .author {
      font-size: 0.7rem;
      color: #639bff;
      margin-bottom: 35px;
    }

    .menu-buttons {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 280px;
    }

    button {
      padding: 14px 10px;
      font-size: 0.8rem;
      font-weight: bold;
      border: 4px solid #ffffff;
      cursor: pointer;
      background-color: #38b764;
      color: #ffffff;
      box-shadow: 4px 4px #181425;
      image-rendering: pixelated;
    }

    button:hover {
      background-color: #41af6e;
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px #181425;
    }

    button.secondary {
      background-color: #29adff;
    }

    button.secondary:hover {
      background-color: #3cb3ff;
    }

    #game-screen {
      background: #5973e8;
    }

    canvas {
      border: 4px solid #ffffff;
      background-color: #3b5dc9;
      box-shadow: 6px 6px #181425;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      width: 384px;
      margin-bottom: 8px;
      font-size: 0.7rem;
      color: #ffcd75;
      text-shadow: 2px 2px #181425;
    }

    .modal {
      position: absolute;
      background: #222034;
      border: 4px solid #ffffff;
      padding: 25px;
      width: 340px;
      text-align: center;
      box-shadow: 8px 8px #181425;
      z-index: 10;
    }

    .modal h2 {
      font-size: 0.9rem;
      margin-bottom: 15px;
      color: #ffcd75;
    }

    .shop-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 15px;
      max-height: 200px;
      overflow-y: auto;
    }

    .shop-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #181425;
      padding: 8px;
      border: 2px solid #ffffff;
      font-size: 0.6rem;
    }
  </style>
</head>
<body>

  <audio id="retro-music" loop>
    <source src="https://actions.google.com/sounds/v1/ambiences/arcade_room.ogg" type="audio/ogg">
  </audio>

  <!-- LOADING SCREEN -->
  <div id="loading-screen" class="screen">
    <div class="spinner"></div>
    <h2>LOADING...</h2>
  </div>

  <!-- MAIN MENU -->
  <div id="menu-screen" class="screen hidden">
    <h1>FLAPPY BIRD REINVENTED</h1>
    <p class="author">BY HENRY GREEN</p>

    <div class="menu-buttons">
      <button id="play-btn">PLAY GAME</button>
      <button id="shop-btn" class="secondary">UPGRADES & SKINS</button>
      <button id="leaderboard-btn" class="secondary">SCORES</button>
      <button id="account-btn" class="secondary">LOGIN</button>
    </div>
  </div>

  <!-- GAME SCREEN -->
  <div id="game-screen" class="screen hidden">
    <div class="hud">
      <span id="score-display">SCORE: 0</span>
      <span id="robins-display">ROBINS: 0 🐦</span>
    </div>
    <canvas id="gameCanvas" width="384" height="512"></canvas>
    <button id="back-to-menu-btn" class="secondary" style="margin-top: 15px; width: 200px;">MENU</button>
  </div>

  <!-- SHOP MODAL -->
  <div id="shop-modal" class="modal hidden">
    <h2>CHARACTER SHOP</h2>
    <p style="font-size: 0.6rem; margin-bottom: 15px; color: #639bff;">Earn Robins by playing!</p>
    <div class="shop-grid" id="shop-list">
      <!-- Populated via JS -->
    </div>
    <button class="secondary close-modal-btn" style="width: 100%;">CLOSE</button>
  </div>

  <!-- ACCOUNT MODAL -->
  <div id="account-modal" class="modal hidden">
    <h2>PLAYER LOGIN</h2>
    <input type="email" id="email-input" placeholder="EMAIL" style="width:100%; padding:8px; margin-bottom:10px; background:#181425; border:2px solid #fff; color:#fff; font-size:0.6rem;" />
    <input type="password" id="password-input" placeholder="PASS" style="width:100%; padding:8px; margin-bottom:10px; background:#181425; border:2px solid #fff; color:#fff; font-size:0.6rem;" />
    <button id="login-submit-btn" style="width:100%; margin-bottom:5px;">LOGIN</button>
    <button class="secondary close-modal-btn" style="width: 100%;">CLOSE</button>
  </div>

  <!-- LEADERBOARD MODAL -->
  <div id="leaderboard-modal" class="modal hidden">
    <h2>TOP PLAYERS</h2>
    <ol style="text-align: left; margin: 15px 0 20px 20px; font-size: 0.6rem; line-height: 2;">
      <li>HENRY GREEN — 100</li>
      <li>PLAYER TWO — 75</li>
      <li>GUEST — 40</li>
    </ol>
    <button class="secondary close-modal-btn" style="width: 100%;">CLOSE</button>
  </div>

  <script>
    const loadingScreen = document.getElementById('loading-screen');
    const menuScreen = document.getElementById('menu-screen');
    const gameScreen = document.getElementById('game-screen');
    const shopModal = document.getElementById('shop-modal');
    const accountModal = document.getElementById('account-modal');
    const leaderboardModal = document.getElementById('leaderboard-modal');
    const bgMusic = document.getElementById('retro-music');

    // Game variables
    let score = 0;
    let robins = parseInt(localStorage.getItem('flappy_robins')) || 0;
    let unlockedSkins = JSON.parse(localStorage.getItem('flappy_skins')) || ['Classic Yellow'];
    let currentSkin = localStorage.getItem('flappy_current_skin') || 'Classic Yellow';

    const skins = [
      { name: 'Classic Yellow', color: '#f8c038', price: 0 },
      { name: 'Neon Pink', color: '#ff0044', price: 10 },
      { name: 'Cyber Blue', color: '#29adff', price: 25 },
      { name: 'Matrix Green', color: '#38b764', price: 50 }
    ];

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let bird = { x: 60, y: 240, radius: 14, gravity: 0.4, lift: -7, velocity: 0 };
    let pipes = [];
    let frameCount = 0;
    let gameRunning = false;
    let gameOver = false;

    window.addEventListener('load', () => {
      setTimeout(() => {
        loadingScreen.classList.add('hidden');
        menuScreen.classList.remove('hidden');
      }, 1500);
      updateUI();
    });

    document.addEventListener('click', () => {
      if (bgMusic.paused) {
        bgMusic.volume = 0.3;
        bgMusic.play().catch(() => {});
      }
    }, { once: true });

    document.getElementById('play-btn').addEventListener('click', () => {
      gameScreen.classList.remove('hidden');
      menuScreen.classList.add('slide-out');
      setTimeout(() => {
        menuScreen.classList.add('hidden');
        menuScreen.classList.remove('slide-out');
        startGame();
      }, 600);
    });

    document.getElementById('back-to-menu-btn').addEventListener('click', () => {
      gameRunning = false;
      gameScreen.classList.add('hidden');
      menuScreen.classList.remove('hidden');
      updateUI();
    });

    document.getElementById('shop-btn').addEventListener('click', () => {
      renderShop();
      shopModal.classList.remove('hidden');
    });

    document.getElementById('account-btn').addEventListener('click', () => {
      accountModal.classList.remove('hidden');
    });

    document.getElementById('leaderboard-btn').addEventListener('click', () => {
      leaderboardModal.classList.remove('hidden');
    });

    document.querySelectorAll('.close-modal-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        shopModal.classList.add('hidden');
        accountModal.classList.add('hidden');
        leaderboardModal.classList.add('hidden');
        updateUI();
      });
    });

    // Jump Control
    window.addEventListener('keydown', e => {
      if ((e.code === 'Space' || e.code === 'ArrowUp') && gameRunning) {
        bird.velocity = bird.lift;
      }
    });

    canvas.addEventListener('click', () => {
      if (gameRunning) {
        bird.velocity = bird.lift;
      } else if (gameOver) {
        startGame();
      }
    });

    function startGame() {
      bird.y = 240;
      bird.velocity = 0;
      pipes = [];
      score = 0;
      frameCount = 0;
      gameRunning = true;
      gameOver = false;
      loop();
    }

    function updateUI() {
      document.getElementById('robins-display').textContent = `ROBINS: ${robins} 🐦`;
      document.getElementById('score-display').textContent = `SCORE: ${score}`;
    }

    function renderShop() {
      const list = document.getElementById('shop-list');
      list.innerHTML = '';
      skins.forEach(skin => {
        const isUnlocked = unlockedSkins.includes(skin.name);
        const isEquipped = currentSkin === skin.name;
        
        const item = document.createElement('div');
        item.className = 'shop-item';
        item.innerHTML = `
          <span style="color:${skin.color}">${skin.name}</span>
          ${isEquipped ? '<span>EQUIPPED</span>' : isUnlocked ? `<button onclick="selectSkin('${skin.name}')">EQUIP</button>` : `<button onclick="buySkin('${skin.name}', ${skin.price})">BUY (${skin.price} 🐦)</button>`}
        `;
        list.appendChild(item);
      });
    }

    window.buySkin = function(name, price) {
      if (robins >= price) {
        robins -= price;
        unlockedSkins.push(name);
        currentSkin = name;
        localStorage.setItem('flappy_robins', robins);
        localStorage.setItem('flappy_skins', JSON.stringify(unlockedSkins));
        localStorage.setItem('flappy_current_skin', currentSkin);
        renderShop();
        updateUI();
      } else {
        alert("Not enough Robins!");
      }
    }

    window.selectSkin = function(name) {
      currentSkin = name;
      localStorage.setItem('flappy_current_skin', currentSkin);
      renderShop();
    }

    function loop() {
      if (!gameRunning) return;

      // Physics
      bird.velocity += bird.gravity;
      bird.y += bird.velocity;

      // Pipe generation
      if (frameCount % 90 === 0) {
        let gap = 120;
        let topHeight = Math.floor(Math.random() * 200) + 60;
        pipes.push({
          x: canvas.width,
          top: topHeight,
          bottom: topHeight + gap,
          passed: false
        });
      }

      // Move pipes
      for (let i = pipes.length - 1; i >= 0; i--) {
        pipes[i].x -= 2.5;

        // Score check
        if (!pipes[i].passed && pipes[i].x < bird.x) {
          score++;
          robins++;
          pipes[i].passed = true;
          localStorage.setItem('flappy_robins', robins);
          updateUI();
        }

        // Collision detection
        if (
          bird.x + bird.radius > pipes[i].x &&
          bird.x - bird.radius < pipes[i].x + 50 &&
          (bird.y - bird.radius < pipes[i].top || bird.y + bird.radius > pipes[i].bottom)
        ) {
          gameRunning = false;
          gameOver = true;
        }

        // Remove offscreen pipes
        if (pipes[i].x < -50) {
          pipes.splice(i, 1);
        }
      }

      // Ground or ceiling collision
      if (bird.y + bird.radius > canvas.height || bird.y - bird.radius < 0) {
        gameRunning = false;
        gameOver = true;
      }

      // DRAWING
      ctx.fillStyle = '#3b5dc9';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Pipes
      ctx.fillStyle = '#38b764';
      pipes.forEach(p => {
        ctx.fillRect(p.x, 0, 50, p.top);
        ctx.fillRect(p.x, p.bottom, 50, canvas.height - p.bottom);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3;
        ctx.strokeRect(p.x, 0, 50, p.top);
        ctx.strokeRect(p.x, p.bottom, 50, canvas.height - p.bottom);
      });

      // Draw Bird
      let activeColor = skins.find(s => s.name === currentSkin)?.color || '#f8c038';
      ctx.fillStyle = activeColor;
      ctx.beginPath();
      ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3;
      ctx.stroke();

      if (gameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ffffff';
        ctx.font = '14px "Press Start 2P"';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
        ctx.font = '8px "Press Start 2P"';
        ctx.fillText('CLICK TO RETRY', canvas.width / 2, canvas.height / 2 + 20);
        return;
      }

      frameCount++;
      requestAnimationFrame(loop);
    }
  </script>
</body>
</html>
